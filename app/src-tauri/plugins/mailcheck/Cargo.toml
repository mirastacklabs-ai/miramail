[package]
name = "tauri-plugin-mailcheck"
version = "0.2.0"
edition = "2021"
description = "iOS background new-mail check (BGAppRefreshTask) bridge for MiraMail: no push, no server"
license = "Apache-2.0"
publish = false
links = "tauri-plugin-mailcheck"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
