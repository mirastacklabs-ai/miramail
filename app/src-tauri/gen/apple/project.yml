name: miramail
options:
  bundleIdPrefix: ai.mirastacklabs.miramail
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: MiraMail
      PRODUCT_BUNDLE_IDENTIFIER: ai.mirastacklabs.miramail.spike
packages:
  tauri-plugin-mailcheck:
    path: ../../plugins/mailcheck/ios
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  # Home-screen widgets (WidgetKit). Read-only view of <App Group>/widget.json that the app writes; no network, no Keychain.
  # Bundle id = <app id>.widgets; ios-device.sh rewrites the spike ids to the BUNDLE_ID it was given and checks both.
  # Keep this target above miramail_iOS: ios-device.sh cuts the file at that target's build-phase script block.
  MiraMailWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: MiraMailWidgets
        excludes: ["*.entitlements"]
    info:
      path: MiraMailWidgets/Info.plist
      properties:
        CFBundleDisplayName: MiraMail
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1.0.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    # Tells Xcode's automatic provisioning that the App Groups capability is on for this App ID (TargetAttributes
    # SystemCapabilities); the entitlements file alone made it build a profile without the group.
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    entitlements:
      path: MiraMailWidgets/MiraMailWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.ai.mirastacklabs.miramail.spike]
    settings:
      base:
        PRODUCT_NAME: MiraMailWidgets
        PRODUCT_BUNDLE_IDENTIFIER: ai.mirastacklabs.miramail.spike.widgets
        SKIP_INSTALL: true
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only for 1.0
        CODE_SIGN_ENTITLEMENTS: MiraMailWidgets/MiraMailWidgets.entitlements
  miramail_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Exclude built static libs: regenerating with xcodegen after a build
      # otherwise turns the per-configuration libapp.a copies into colliding
      # resources ("Multiple commands produce …/libapp.a"). They are linked
      # via LIBRARY_SEARCH_PATHS, never bundled as resources.
      - path: Externals
        excludes: ["**/*.a"]
      - path: miramail_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: miramail_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        # Background new-mail check (BGAppRefreshTask, no push). Same id as plugins/mailcheck/ios/Sources/MailCheckPlugin.swift.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [ai.mirastacklabs.miramail.refresh]
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1.0.0"
        # TLS only (IMAP/SMTP/HTTPS through rustls): exempt encryption, no export-compliance question per upload.
        ITSAppUsesNonExemptEncryption: false
        # Widget taps: miramail://mail and miramail://calendar (handled in widget_snapshot.rs, RunEvent::Opened).
        CFBundleURLTypes:
          - CFBundleURLName: ai.mirastacklabs.miramail.link
            CFBundleURLSchemes: [miramail]
    # Tells Xcode's automatic provisioning that the App Groups capability is on for this App ID (TargetAttributes
    # SystemCapabilities); the entitlements file alone made it build a profile without the group.
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    entitlements:
      path: miramail_iOS/miramail_iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.ai.mirastacklabs.miramail.spike]
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only for 1.0
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - target: MiraMailWidgets
        embed: true
      - package: tauri-plugin-mailcheck
        product: tauri-plugin-mailcheck
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: |
          npm run -- tauri ios xcode-script -v --platform "${PLATFORM_DISPLAY_NAME:?}" --sdk-root "${SDKROOT:?}" --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration "${CONFIGURATION:?}" ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a