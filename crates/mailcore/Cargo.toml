[package]
name = "mailcore"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false
description = "MiraMail mail core: IMAP/SMTP/MIME/storage/secrets"

[dependencies]
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
mail-parser = "1"
ammonia = "4"
rusqlite = { version = "0.41", features = ["bundled"] }
keyring = "4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
base64 = "0.23"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time"] }
