# Known email-tracking patterns. Best-effort, hand-curated; static heuristics only.
# Subset-of-TOML format parsed by src/tracking.rs (no toml dependency):
#   [[rule]]    name (required) + any of host_suffix / host_contains / path (all given must match)
#   [[generic]] contains (substring of lowercase path+query) + reason
# host_suffix matches the host or any subdomain; path is a substring of the lowercase path+query.
# First matching [[rule]] wins, so put specific hosts before path-only rules.

[[rule]]
name = "Mailchimp open tracking"
host_suffix = "list-manage.com"
path = "/track/open"

[[rule]]
name = "Mandrill open tracking"
host_suffix = "mandrillapp.com"
path = "/track/open"

[[rule]]
name = "Klaviyo open tracking"
host_suffix = "klaviyomail.com"

[[rule]]
name = "Klaviyo open tracking"
host_suffix = "klclick.com"

[[rule]]
name = "Klaviyo open tracking"
host_suffix = "klaviyo.com"
path = "/wf/open"

[[rule]]
name = "SendGrid link/open tracking"
host_contains = "ablink."

