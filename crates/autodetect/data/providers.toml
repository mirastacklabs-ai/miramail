# Bundled provider data (hand-seeded; NOT yet a full Mozilla ISPDB snapshot).
# Spec: docs/AUTODETECT_SPEC.md sections 1 and 3.  Every host must be verified
# against the live service before release (open item in the spec).
#
# Fields
#   id, name            identifiers
#   domains             email domains served directly (exact match)
#   mx                  MX host globs ('*' wildcard, case-insensitive)
#   unsupported         true => detect() returns UnsupportedProvider (OAuth only)
#   imap / smtp         servers (in preference order) for custom domains found via MX
#   personal_imap/smtp  servers for the provider's own domains (default: imap/smtp)
#   local_part_fallback allow retrying auth with the local part as username
#   app_password_url    set when the provider requires app passwords (deep link)
#   imap_disabled_url   set when IMAP can be switched off per account (Zoho)
#   generic             template entry used only by heuristics ({domain} placeholder)
# tls is "implicit" (993/465) or "starttls" (143/587). Plaintext is never offered.

# ---------------------------------------------------------------- Google and Microsoft (not supported yet; parked by the owner 2026-11-08)
# Later: Gmail via app password (imap.gmail.com:993, smtp.gmail.com:465, https://myaccount.google.com/apppasswords) and OAuth for both.
[[provider]]
id = "google"
name = "Google"
domains = ["gmail.com", "googlemail.com"]
mx = ["aspmx.l.google.com", "*.aspmx.l.google.com", "*.googlemail.com", "*.google.com", "smtp.google.com"]
unsupported = true

[[provider]]
id = "microsoft"
name = "Microsoft"
domains = ["outlook.com", "hotmail.com", "live.com", "msn.com", "outlook.de", "hotmail.co.uk"]
mx = ["*.outlook.com", "*.mail.protection.outlook.com", "*.hotmail.com"]
unsupported = true

