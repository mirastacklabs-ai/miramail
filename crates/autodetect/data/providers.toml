# Generic cPanel / web-host layout. Only used as a heuristic template, ranked
# lowest; hostnames must resolve in DNS before they are offered.
[[provider]]
id = "cpanel"
name = "cPanel / web host (generic)"
generic = true
local_part_fallback = true
imap = [{ host = "mail.{domain}", port = 993, tls = "implicit" }]
smtp = [{ host = "mail.{domain}", port = 465, tls = "implicit" }, { host = "mail.{domain}", port = 587, tls = "starttls" }]

# Excluded on purpose: Proton Bridge (local bridge, not a mail server),
# Tutanota (no IMAP).
