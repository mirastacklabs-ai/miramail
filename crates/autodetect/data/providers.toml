# GMX: the .net family (gmx.net/.de/.at/.ch) and the .com/.us family use
# different servers. IMAP/POP3 access is OFF by default and must be enabled in
# GMX settings ("POP3 & IMAP" -> allow external access); the hint mechanism
# (AuthHint) has no generic variant for this yet, so it is not surfaced.
[[provider]]
id = "gmx"
name = "GMX"
domains = ["gmx.net", "gmx.de", "gmx.at", "gmx.ch"]
mx = ["*.gmx.net"]
imap = [{ host = "imap.gmx.net", port = 993, tls = "implicit" }]
smtp = [{ host = "mail.gmx.net", port = 465, tls = "implicit" }, { host = "mail.gmx.net", port = 587, tls = "starttls" }]

