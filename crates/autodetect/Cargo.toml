[package]
name = "autodetect"
version = "0.1.0"
edition = "2021"
description = "MiraMail mail-server auto-detection and credential verification"
license = "LicenseRef-Proprietary"
publish = false

[lib]
name = "autodetect"
path = "src/lib.rs"

[[bin]]
name = "autodetect"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "net", "time", "io-util", "io-std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
hickory-resolver = "0.25"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
quick-xml = "0.37"
thiserror = "2"
rpassword = "7"

[dev-dependencies]
toml = { version = "0.8", default-features = false, features = ["display"] }
# Paused clock for the slow-server tests (test builds only; adds nothing to the app).
tokio = { version = "1", default-features = false, features = ["test-util"] }
